<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | Young Leonidas</title>
    <meta
      name="description"
      content="The page you requested was not found. Return to the Young Leonidas homepage."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0f0f10;
        --text: #f8f1e3;
        --muted: #c9baa1;
        --line: rgba(248, 241, 227, 0.16);
        --accent: #c38b4d;
        --accent-bright: #efbb73;
        --shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Instrument Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(circle at top, rgba(195, 139, 77, 0.16), transparent 24rem),
          linear-gradient(180deg, #151212 0%, #0f0f10 40%, #111214 100%);
      }

      .not-found {
        width: min(calc(100% - 2rem), 52rem);
        padding: 5rem 0;
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 1rem;
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--accent-bright);
      }

      h1 {
        margin: 0;
        font-family: "Instrument Serif", serif;
        font-size: clamp(2.8rem, 8vw, 5.2rem);
        font-weight: 600;
        line-height: 1.05;
        letter-spacing: 0.03em;
        text-wrap: balance;
      }

      p {
        max-width: 34rem;
        margin: 1.25rem auto 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.9rem;
        margin-top: 2rem;
      }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 3.25rem;
        padding: 0 1.25rem;
        border: 1px solid var(--line);
        border-radius: 999px;
        font-size: 0.84rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: inherit;
        text-decoration: none;
        transition:
          transform 180ms ease,
          background-color 180ms ease,
          border-color 180ms ease;
      }

      .button:hover,
      .button:focus-visible {
        transform: translateY(-1px);
      }

      .button-primary {
        color: #141312;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-bright) 100%);
        border-color: transparent;
        box-shadow: var(--shadow);
      }

      .button-secondary {
        background: rgba(255, 248, 234, 0.03);
      }

      .button-secondary:hover,
      .button-secondary:focus-visible {
        background: rgba(255, 248, 234, 0.08);
      }

      @media (max-width: 640px) {
        .button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="eyebrow">404</p>
      <h1>This path ends at the wall.</h1>
      <p>
        The file is missing, the route is wrong, or the domain is still
        propagating. The site itself is intact.
      </p>
      <div class="hero-actions">
        <a class="button button-primary" data-home-link href="/">Return home</a>
        <a class="button button-secondary" href="https://github.com/Thehandsomebog/YoungLeonidas" target="_blank" rel="noreferrer">View repository</a>
      </div>
    </main>
    <script>
      const homeLink = document.querySelector("[data-home-link]");
      const repoName = "YoungLeonidas";
      const isGitHubProjectSite =
        window.location.hostname.endsWith(".github.io") &&
        window.location.pathname.includes(`/${repoName}/`);

      homeLink.setAttribute("href", isGitHubProjectSite ? `/${repoName}/` : "/");
    </script>
  </body>
</html>
