name: Notify IndexNow

on:
  push:
    branches: [main]
    paths:
      - "**.html"
      - "sitemap.xml"
      - "robots.txt"
      - "feed.xml"
      - "assets/**"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit-urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Submit sitemap URLs to IndexNow
        env:
          INDEXNOW_KEY: 2eb53b437eddfabcd779e182ede1b88e
        run: |
          URLS=$(grep -oE 'https://youngleonidas\.com/[^<]*' sitemap.xml | sed 's/[[:space:]]*$//' | sort -u)
          JSON_URLS=$(printf '%s\n' "$URLS" | jq -R . | jq -s .)
          jq -n \
            --arg host "youngleonidas.com" \
            --arg key "$INDEXNOW_KEY" \
            --arg keyLocation "https://youngleonidas.com/${INDEXNOW_KEY}.txt" \
            --argjson urlList "$JSON_URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}' \
            > indexnow-payload.json
          curl --fail-with-body \
            --retry 3 \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json \
            https://api.indexnow.org/indexnow
